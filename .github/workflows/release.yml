name: Validar y desplegar

on:
  push:
    branches:
      - main
      - qa
      - prod
      - 'dev/**'
  pull_request:
    branches:
      - main
      - qa
      - prod
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/check-snapshots.mjs
      - run: npm run lint:check
      - run: npm run test:unit -- --run
      - run: npm run build
      - name: Guardar artefacto validado
        if: github.ref == 'refs/heads/prod' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: estanque-de-mudkip-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/prod' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://m3rsync.com/estanque-de-mudkip/
    concurrency:
      group: estanque-de-mudkip-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: estanque-de-mudkip-${{ github.sha }}
          path: dist/
      - name: Validar configuracion de la VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_VIRTUALMIN_USER: ${{ secrets.VPS_VIRTUALMIN_USER }}
        run: |
          test -n "$VPS_HOST" || { echo 'Falta VPS_HOST'; exit 1; }
          test -n "$VPS_USER" || { echo 'Falta VPS_USER'; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo 'Falta VPS_SSH_KEY'; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo 'Falta VPS_KNOWN_HOSTS'; exit 1; }
          test -n "$VPS_VIRTUALMIN_USER" || { echo 'Falta VPS_VIRTUALMIN_USER'; exit 1; }
      - name: Publicar release y verificar URL
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_VIRTUALMIN_USER: ${{ secrets.VPS_VIRTUALMIN_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/deploy-vps.sh
